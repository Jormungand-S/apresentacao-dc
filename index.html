<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta Comercial - DC Gestão & Performance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mobile Overlays -->
    <div id="mobile-warning-overlay" class="mobile-overlay" style="display: none;">
        <div class="mobile-overlay-content glass">
            <h3>📱 Experiência Otimizada para Desktop</h3>
            <p>Para a melhor experiência, recomendamos visualizar esta proposta pelo seu notebook ou computador.</p>
            <button id="btn-continue-mobile" class="mobile-btn mt-4">Continuar no celular</button>
        </div>
    </div>
    
    <div id="mobile-rotate-overlay" class="mobile-overlay" style="display: none;">
        <div class="mobile-overlay-content glass text-center">
            <h3 style="font-size: 40px; margin-bottom: 20px;">🔄</h3>
            <h3>Vire o celular na horizontal</h3>
            <p>A apresentação precisa de mais espaço na tela para ser exibida corretamente.</p>
        </div>
    </div>

    <!-- Wow Features Elements -->
    <div class="cursor-glow"></div>
    <div class="top-progress-bar">
        <div class="progress-fill"></div>
    </div>

    <div class="presentation-wrapper">
        <div class="presentation-container">
            <!-- Swiper -->
            <div class="swiper mySwiper">
                <div class="swiper-wrapper" id="swiper-wrapper-id">
                    <!-- Slides will be injected or placed here -->
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>
    </div>

    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="slides-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
